name: build

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  jekyll:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci

      - name: Setup flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Check dino game
        working-directory: dino_game
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Build dino game
        run: ./scripts/build-dino.sh

      - name: Build Jekyll
        uses: limjh16/jekyll-action-ts@v2
        with:
          enable_cache: true
          format_output: true
          prettier_opts: '{ "useTabs": true }'

      - name: Check that Tailwind generated the utilities
        run: grep -qE '\.flex\s*\{' _site/assets/css/main.css
