<!DOCTYPE html>
<html>
	<head>
		<base href="/assets/dino/" />

		<meta charset="UTF-8" />
		<meta content="IE=Edge" http-equiv="X-UA-Compatible" />
		<meta
			name="description"
			content="The Chrome dino game, made with the Flame engine."
		/>

		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black" />
		<meta name="apple-mobile-web-app-title" content="Flame dino game" />

		<title>Flame dino game</title>
	</head>
	<body>
		<script>
			// Embedded in a page, the arrow keys and space would also scroll it.
			window.addEventListener(
				"keydown",
				function (event) {
					if (
						["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].indexOf(
							event.key
						) !== -1
					) {
						event.preventDefault();
					}
				},
				true
			);
		</script>
		<script src="flutter_bootstrap.js" async></script>
	</body>
</html>
